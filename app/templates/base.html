<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}food.bringon.io — weet wat je eet{% endblock %}</title>
  <meta name="description" content="Gezondheidsscore met onderbouwing per productcategorie, plus een streepjescode-scanner voor alles daarbuiten.">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">🥗 food.bringon.io</a>
    <nav>
      <a href="/">Categorieën</a>
      <a href="/scannen">Scannen</a>
      <a href="/methodologie">Hoe werkt dit</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>v0.13 — score alleen vergeleken binnen dezelfde categorie. Geen score is een advies buiten die categorie.</p>
    <p>Streepjescode-gegevens via <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> — dat is niet onze v0.13-score.</p>
  </footer>
</body>
</html>
